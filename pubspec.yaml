name: elements
description: Element Shift — 2D elemental puzzle-platformer (Flutter + Flame).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine (§14.1)
  flame: ^1.32.0
  flame_audio: ^2.11.11
  archive: ^3.6.1

  # App shell (§14.1)
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1

  # Persistence (§18)
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Monetization (§10 / Sprint 9 wiring)
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.2.3

  # Analytics (optional per §14.1; initialized later)
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/images/
    - assets/images/characters/
    - assets/images/tiles/
    - assets/images/fx/
    - assets/images/ui/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/ui/
    - assets/fonts/
